name: AnatomyAtlas
options:
  bundleIdPrefix: org.openanatomy.study
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    PRODUCT_BUNDLE_IDENTIFIER: org.openanatomy.study.atlas
targets:
  AnatomyAtlas:
    type: application
    platform: iOS
    sources: [AnatomyAtlas]
    resources: [AnatomyAtlas/Resources]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anatomy Atlas
