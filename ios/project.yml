# Sorta for iPhone and iPad. `xcodegen generate` in ios/ makes Sorta.xcodeproj
# and Sorta/Info.plist from this file; neither is committed. The settings start
# from Stethoscore's (reference/stethoscore-aec2af1c/ios/project.yml).
name: Sorta
options:
  bundleIdPrefix: com.cramdown
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sorta:
    type: application
    platform: iOS
    sources:
      - path: Sorta
        excludes:
          - Resources/Earth
          # the Share extension's own (SortaShare, below)
          - ShareExtension
      # The Earth maps the Space theme's rocky planets wear (NASA imagery;
      # where each comes from and its licence: the folder's SOURCES.md), as
      # a folder, so they sit in Earth/ in the app (GraphEarth.swift), as
      # Stethoscore has them (its project.yml:39-44)
      - path: Sorta/Resources/Earth
        type: folder
        buildPhase: resources
      # The icon and the alternate icons, for the builds the owner installs:
      # tools/private/wire_art.py copies them in, and those builds name the
      # icon on the xcodebuild line. Never committed, so other builds have no
      # icon and nothing drawn in its place.
      - path: Art
        optional: true
      # S07b: the add-on engine, QuickJS-ng as vendored (unmodified, so its
      # warnings are quiet), and the shared C host; Swift reaches the host
      # through addons/engine/host/module.modulemap (SortaAddonsC)
      - path: ../addons/engine/quickjs-ng
        includes:
          - "*.c"
        compilerFlags:
          - "-w"
          # optimised in every build: section 6's limits are in milliseconds
          - "-O2"
      - path: ../addons/engine/host
        includes:
          - "*.c"
        compilerFlags:
          - "-O2"
    info:
      path: Sorta/Info.plist
      properties:
        CFBundleDisplayName: Sorta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
        # The first frame is the page colour alone, light or dark with the
        # phone (the Page colour set). The first screen shows no mark, so the
        # launch screen shows none either (work/T0137/README.md, A4).
        UILaunchScreen:
          UIColorName: Page
        # As Stethoscore had it (T0138): the phone turns on its side and opens
        # as a book, but never upside down; the iPad turns every way.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        # The kit's type (WardFont): Nunito, with Arabic in Baloo Bhaijaan 2,
        # both SIL OFL 1.1 (their OFL files are beside them in Sorta/Fonts)
        UIAppFonts:
          - Nunito[wght].ttf
          - Nunito-Italic[wght].ttf
          - BalooBhaijaan2[wght].ttf
        # Stethoscore's library backup, which Import from Stethoscore… opens
        # with the system's file picker (IdeasView, IdeaImportFlow): imported,
        # since Stethoscore owns it, with the id, description and extension
        # Stethoscore declares (reference/stethoscore-aec2af1c/ios/project.yml:
        # 213-220). The description's words are in InfoPlist.xcstrings.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.cramdown.stethoscore.backup
            UTTypeDescription: Stethoscore backup
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - stethoscorebackup
        # Sorta's own links: sorta://...
        CFBundleURLTypes:
          - CFBundleURLName: com.cramdown.sorta
            CFBundleURLSchemes:
              - sorta
        # S07b: net for add-ons (SORTA_ADDON_NET), and the directory's
        # index URL, empty until the directory exists
        SortaAddonNet: $(SORTA_ADDON_NET)
        SortaAddonsIndexURL: $(SORTA_ADDONS_INDEX_URL)
    # The Share extension is built with the app, but signed and put in the
    # app's PlugIns only when SORTA_SHARE_EXTENSION is YES: a device build
    # spends a second App ID on it (com.cramdown.sorta.share), and a free
    # Apple ID has 2 a week, so it stays out until the owner agrees. CI
    # builds with it on, and tools/check_ios_app.py --share checks it is in.
    dependencies:
      - target: SortaShare
        embed: false
    postBuildScripts:
      - name: Embed the Share extension when SORTA_SHARE_EXTENSION is YES
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          plugins="${TARGET_BUILD_DIR}/${PLUGINS_FOLDER_PATH}"
          rm -rf "${plugins}/SortaShare.appex"
          if [ "${SORTA_SHARE_EXTENSION:-NO}" = "YES" ]; then
            mkdir -p "${plugins}"
            cp -R "${BUILT_PRODUCTS_DIR}/SortaShare.appex" "${plugins}/"
            echo "the Share extension is in ${PLUGINS_FOLDER_PATH}"
          else
            rmdir "${plugins}" 2>/dev/null || true
            echo "the Share extension is left out (SORTA_SHARE_EXTENSION is not YES)"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.sorta
        SORTA_SHARE_EXTENSION: "NO"
        # the embed script copies a built product into the app, which the
        # script sandbox would refuse without listing every file
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # XcodeGen names an icon, AppIcon, for every app, and the asset
        # compiler stops when the catalog has none. These builds have none;
        # the builds with the art name it on the xcodebuild line.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # S07b: add-ons' net (YES by default), the directory's index URL,
        # and the C host's module map for Swift
        SORTA_ADDON_NET: "YES"
        SORTA_ADDONS_INDEX_URL: ""
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../addons/engine/host
  # Sorta in the share sheet (S06b, plugins plan idea 10): it hands the
  # shared text and link to the app as sorta://share?text=..., where the
  # share sheet keeps the words chosen (ShareSheet). Its own bundle id; a
  # device build needs one more App ID for it, so it is signed and embedded
  # only with SORTA_SHARE_EXTENSION=YES (the app's settings above). Its
  # Info.plist is made by `xcodegen generate`, like the app's, and is not
  # committed.
  SortaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sorta/ShareExtension
        excludes:
          - Info.plist
    info:
      path: Sorta/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sorta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.sorta.share
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # unsigned, so no App ID is made for it, unless it is to be embedded
        SORTA_SHARE_EXTENSION: "NO"
        CODE_SIGNING_ALLOWED: $(SORTA_SHARE_EXTENSION)
  # The look kit's SwiftUI checks (touch targets, fonts), run in the app.
  # The Foundation-only suites in UnitTests/Suites belong to no target:
  # tools/swift_suites.py builds them with swiftc.
  SortaUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests/SortaUnitTests
      # S07b: the add-on fixtures and conformance cases, as folders
      - path: ../addons/fixtures
        type: folder
        buildPhase: resources
      - path: ../addons/conformance
        type: folder
        buildPhase: resources
      # the kit: its API snapshot, its sample ideas and its template's own tests
      - path: ../addons/kit
        type: folder
        buildPhase: resources
    dependencies:
      - target: Sorta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.sorta.unittests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sorta.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sorta
        BUNDLE_LOADER: $(TEST_HOST)
        # S07b: the C host's module map, which Sorta's module imports
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../addons/engine/host
  SortaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # the Ideas tests write their made-up Stethoscore backup with the
      # app's own zip writer (IdeasUITestSupport)
      - path: Sorta/Shared/MiniZip.swift
    dependencies:
      - target: Sorta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sorta
        PRODUCT_BUNDLE_IDENTIFIER: com.cramdown.sorta.uitests
schemes:
  Sorta:
    build:
      targets:
        Sorta: all
        SortaUnitTests: [test]
        SortaUITests: [test]
    test:
      targets:
        - SortaUnitTests
        - SortaUITests
    run:
      config: Debug
