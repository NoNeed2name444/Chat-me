# Checks each pull request: the add-ons it adds and any change to
# revoked.json. It runs on pull_request only, so a pull request from a fork
# gets a read-only token and no secret. The checks come from the base branch
# (the "trusted" checkout), so a pull request can't change the rules it is
# checked by. The pull request's own files are only read, never run, except
# inside the harness, which runs add-ons under the app's limits.
# kit/tools/review.py says what each check does.
name: Check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Check the submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the checks from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check the add-ons and revoked.json
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I trusted/kit/tools/review.py pr --repo pr --base "$BASE_SHA"
      - name: List the permissions and hosts
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I trusted/kit/tools/review.py summary --repo pr --base "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the harness
        run: make -C trusted/kit/harness
      - name: Run each command and card view in the harness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I trusted/kit/tools/review.py harness --repo pr --base "$BASE_SHA" --harness trusted/kit/harness/harness --ideas trusted/kit/api/sample-ideas.json
