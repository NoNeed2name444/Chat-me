name: Submit an add-on
description: Can't open a pull request? Share your add-on's source here, and we'll open one for you.
title: "Submit: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        The usual way to submit is a pull request that adds your add-on's folder. CONTRIBUTING.md explains how. If you can't open one, fill in this form and we'll open the pull request for you. The same checks and review apply.
  - type: input
    id: addon
    attributes:
      label: Add-on id
      placeholder: io.github.example.wordcount
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the source
      description: A public https:// link to the folder with manifest.json, your .js and .json files, README.md and LICENSE.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Before you submit
      options:
        - label: I wrote this add-on, or I have the right to share it under its license.
          required: true
        - label: It's free, with no payment or tip links.
          required: true
        - label: It has no points, streaks, ranks or leaderboards.
          required: true
        - label: python3 -I kit/tools/check.py on its folder prints ok.
          required: true
