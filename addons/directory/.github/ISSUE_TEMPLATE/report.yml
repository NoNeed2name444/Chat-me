name: Report an add-on
description: Tell us about an add-on that breaks the rules, misuses your ideas or doesn't work.
title: "Report: "
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. We aim to reply within 7 days. If an add-on breaks the rules, we turn it off for everyone through revoked.json.

        Don't include your ideas, passwords or anything else private.
  - type: input
    id: addon
    attributes:
      label: Add-on id
      description: It's on the add-on's page in Sorta, under its name.
      placeholder: io.github.example.wordcount
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: false
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong
      options:
        - It asks for money, or links to payments or tips
        - It adds points, streaks, ranks or a leaderboard
        - It sends my ideas somewhere it shouldn't
        - It changes ideas I didn't ask it to change
        - Its content isn't right for everyone
        - It doesn't work
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you did, what the add-on did, and on which device.
    validations:
      required: true
