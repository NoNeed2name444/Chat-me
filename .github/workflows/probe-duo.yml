name: Probe Duo
on:
  push:
    branches: [probe-duo]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: What this runner has
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            echo "image $ImageOS $ImageVersion"
            sw_vers
            ls -d /Applications/Xcode*.app
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Newest Xcode, its iOS runtimes and foldable device types
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "no Xcode 27 on this runner" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
          if ! xcrun simctl list runtimes | grep -q 'iOS 27'; then
            xcodebuild -downloadPlatform iOS || echo "runtime download failed"
            xcrun simctl list runtimes | grep -i ios || true
          fi
          {
            echo '```'
            xcodebuild -version
            xcrun simctl list runtimes | grep -i ios
            xcrun simctl list devicetypes | grep -iE 'duo|fold' || echo "no foldable iPhone among the device types"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
