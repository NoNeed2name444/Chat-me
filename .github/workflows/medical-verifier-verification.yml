name: medical-verifier-verification

on:
  pull_request:
    paths:
      - "medical-verifier/**"
      - ".github/workflows/medical-verifier-verification.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  swift-tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: medical-verifier/ios/MedicalVerifierCore
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"
      - run: swift test
