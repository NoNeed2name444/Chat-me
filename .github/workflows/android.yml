# Sorta's Android app, on every copy pushed to Chat-me's sorta branch
# (tools/mirror_chatme.py): the debug APK built and checked, and the unit
# tests run. The SDK steps are Stethoscore's
# (reference/stethoscore-aec2af1c/.github/workflows/android.yml). Chat-me is
# public, so its standard runners cost nothing; no secret is used. A second
# run of the same copy is a re-run of this one.
name: Android
on:
  push:
    branches: [sorta]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # step 1's runs took 2 to 3 minutes; the look kit's 104 tests and eight
    # gallery renders take about 8 here, so about twice that
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: The command-line tools that know Android 17
        run: |
          # setup-android@v4 names the folder by the tools' own version
          # (22.0), not by the build number, so follow the sdkmanager it put
          # first on the PATH
          tools="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          echo "sdkmanager from $tools"
          if [ "$tools" != "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled-backup"
            ln -s "$tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install the Android 17 SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build the APK and run the unit tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: The APK
        run: python3 tools/check_apk.py "$ANDROID_HOME/build-tools/37.0.0/aapt2" android/app/build/outputs/apk/debug/app-debug.apk
      - name: The tests that ran
        if: ${{ always() }}
        run: |
          set -o pipefail
          python3 tools/junit_summary.py android/app/build/test-results/testDebugUnitTest --expect ChunkCacheTest=5 --expect FrameBudgetTest=5 --expect GraphAndOctreeTest=6 --expect IdeaBookTest=17 --expect IdeasReadoutTest=1 --expect LaunchTest=10 --expect LineStyleTest=6 --expect LodSelectorTest=9 --expect MapDrawnTest=3 --expect MapMathTest=4 --expect SpaceDepthTest=14 --expect SpaceStyleTest=20 --expect WardDarkFacesTest=2 --expect WardDockTest=5 --expect WardFontsTest=4 --expect WardFrameClearTest=5 --expect WardGalleryRenderTest=8 --expect WardGroundTest=4 --expect WardIslandTest=5 --expect WardKitPortTest=7 --expect WardLightSliceTest=5 --expect WardLookTest=11 --expect WardMotionTest=1 --expect WardPaletteTest=10 --expect WardPressIndicationTest=1 --expect WardReduceMotionTest=1 --expect WardReliefTest=6 --expect WardStatesTest=4 --expect WardTokensTest=6 --expect WardTouchTargetTest=1 --expect WindowShapeTest=8 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: sorta-android
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
