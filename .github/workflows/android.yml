# perf, 15 Nov: a measurement copy only, never landed: Sorta at 9398dd4
# with the frame instrumentation alone, so the frames are timed before the
# fixes; the renders job runs only the frame tests (FramePerfTest).
# Sorta's Android app, on every copy pushed to Chat-me's sorta branch
# (tools/mirror_chatme.py): the debug APK built and checked, and the unit
# tests run. The SDK steps are Stethoscore's
# (reference/stethoscore-aec2af1c/.github/workflows/android.yml). Chat-me is
# public, so its standard runners cost nothing; no secret is used. A second
# run of the same copy is a re-run of this one.
name: Android
on:
  push:
    branches: [sorta, sorta-b, sorta-c, sorta-d, sorta-e, sorta-f]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # step 1's runs took 2 to 3 minutes; the look kit's 104 tests and eight
    # gallery renders take about 8 here, so about twice that
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: The command-line tools that know Android 17
        run: |
          # setup-android@v4 names the folder by the tools' own version
          # (22.0), not by the build number, so follow the sdkmanager it put
          # first on the PATH
          tools="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          echo "sdkmanager from $tools"
          if [ "$tools" != "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled-backup"
            ln -s "$tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install the Android 17 SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Build the APK and run the unit tests
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: The capsule page (S06d A6), kept with the tests as iOS keeps capsule-ios.html
        run: test -s android/app/build/outputs/capsule/capsule-android.html
      - name: The APK
        run: python3 tools/check_apk.py "$ANDROID_HOME/build-tools/37.0.0/aapt2" android/app/build/outputs/apk/debug/app-debug.apk
      - name: The tests that ran
        if: ${{ always() }}
        run: |
          set -o pipefail
          python3 tools/junit_summary.py android/app/build/test-results/testDebugUnitTest --expect BoardSpreadTest=12 --expect CapsuleOfferTest=2 --expect CapsuleRenderTest=5 --expect CapsuleTest=9 --expect ChunkCacheTest=5 --expect DeckRenderTest=6 --expect DeckTouchTest=6 --expect EditorChipGlyphTest=2 --expect FrameBudgetTest=5 --expect FrameSummaryTest=3 --expect GraphAndOctreeTest=7 --expect HomeViewTest=10 --expect IdeaBoardCurveTest=4 --expect IdeaBookReshapeTest=6 --expect IdeaBookTest=20 --expect IdeaEchoesTest=4 --expect IdeaImportTest=7 --expect IdeaLensTest=6 --expect IdeaLensVisibilityTest=6 --expect IdeaReshapeTest=5 --expect IdeasBannerTest=3 --expect IdeaShapesFlowTest=7 --expect IdeaShapesRenderTest=4 --expect IdeasMapVersionTest=2 --expect IdeasReadoutTest=1 --expect IdeasSplitTest=5 --expect IdeaStoreTest=6 --expect LabelContrastTest=7 --expect LabelRoomTest=7 --expect LaunchTest=10 --expect LineStyleTest=12 --expect LinkCurveTest=10 --expect LinkGrowthTest=5 --expect LinkKindTest=8 --expect LinkMemoryTest=8 --expect LinkStripsTest=6 --expect LodSelectorTest=9 --expect MapCameraEaseTest=9 --expect MapCardCoverTest=4 --expect MapDeathTest=16 --expect MapDragTest=22 --expect MapDrawnTest=27 --expect MapFilterTest=18 --expect MapFitTest=7 --expect MapFlightTest=1 --expect MapLegendRenderTest=10 --expect MapLegendTest=9 --expect MapLensRenderTest=6 --expect MapLinkFocusTest=7 --expect MapLookCellsTest=4 --expect MapLookTest=6 --expect MapLookWordsTest=3 --expect MapMarkTest=14 --expect MapMathTest=8 --expect MapModeRenderTest=10 --expect MapModeTest=16 --expect MapNameShowTest=13 --expect MapNamesTest=10 --expect MapPanelsTouchTargetTest=7 --expect MapPeekCardTest=17 --expect MapPeekTest=11 --expect MapRestLengthTest=2 --expect MapSelectionTest=19 --expect MapSpotTest=6 --expect MapTouchCardTest=5 --expect NeuronHierarchyTest=10 --expect NeuronLookTest=19 --expect NeuronMembraneTest=7 --expect NoteMarksTest=4 --expect PerfFolderLinesTest=10 --expect PerfForceTest=6 --expect PerfLayoutTest=11 --expect PerfSyntheticTest=9 --expect PerfTourTest=10 --expect SkyChromeTest=9 --expect SkyFieldsTest=3 --expect SkyIdeasTest=11 --expect SkySpaceTest=6 --expect SortaModeTest=4 --expect SortDeckTest=7 --expect SortRenderTest=9 --expect SortScreenTest=20 --expect SortTouchTargetTest=3 --expect SpaceBodiesKeptTest=5 --expect SpaceBodiesOwnSizeTest=3 --expect SpaceDepthTest=15 --expect SpaceFilterOffTest=2 --expect SpaceStyleTest=23 --expect SpaceTrailsTest=13 --expect UniverseDrawnLinksTest=2 --expect UniversePlanTest=18 --expect WardDarkFacesTest=2 --expect WardDockTest=5 --expect WardFontsTest=4 --expect WardFrameClearTest=5 --expect WardGalleryRenderTest=8 --expect WardGroundTest=4 --expect WardIslandTest=5 --expect WardKitPortTest=7 --expect WardLightSliceTest=5 --expect WardLookTest=11 --expect WardMotionTest=1 --expect WardPaletteTest=10 --expect WardPressIndicationTest=1 --expect WardReduceMotionTest=1 --expect WardReliefTest=6 --expect WardStatesTest=4 --expect WardTokensTest=6 --expect WardTouchTargetTest=1 --expect WindowShapeTest=8 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: sorta-android-apks
          path: android/app/build/outputs/apk/
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: sorta-android
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
            android/app/build/outputs/capsule/
          if-no-files-found: ignore
          retention-days: 7
  # The maps' renders on an emulator (MapRenderTest), a phone and a tablet:
  # GL draws only on a real surface, which the unit tests' Robolectric has
  # not. The emulator steps are Stethoscore's screenshots job
  # (reference/stethoscore-aec2af1c/.github/workflows/android.yml and
  # android/scripts/capture-screenshots.sh). Its first green run (Chat-me
  # run 40855930084) took 4.1 minutes on the phone and 5.0 on the tablet,
  # so it has about twice that. Map mode's Space (MapModeSpaceRenderTest), two
  # stills more on each device, takes it to about 6.5, so 13. The phone's run
  # also takes To sort with the three-button navigation bar
  # (SortNavBarRenderTest), two stills, and Map mode with it
  # (MapModeNavBarRenderTest, S05b A6), two more: about 7.5, so 15.
  # S05g2's let-goes settle on iOS's clamped step, one 0.05 s step a frame,
  # about 100 frames each; the tablet's SwiftShader draws about 3 frames a
  # second, so its Space test took 5.5 minutes on its own (run 43234510513)
  # and the job runs about 16 to 17: so 35.
  # S05h: one limit per device, about twice the measured green times (phone
  # 13.3 and 14.1 min, tablet 14.3 and 15.8): 30 for the phone, 35 for the
  # tablet. The Universe's steps and its lively test are measured on top.
  # S05h2 adds two lively tests (deaths and sparks) and a death check in
  # Map mode's Space; the limits stand until a green run measures them.
  # 13 Nov: the combined version (v13) runs every task's sets in one job. On
  # their own, S05h2's tablet renders took about 23 min and S05i's about 21,
  # so the old 35/30 left no room for both; 50/45 is about twice that.
  # 15 Nov: v14 joins four lanes' emulator sets. On copy b4bfd31 the renders
  # took 26 min (tablet) and 24 (phone); each lane's green run added 9, 3, 6
  # and 4 on the tablet and 4, 2, 3 and 1 on the phone, so about 48 and 34
  # together, which 50/45 would cut short: 75/55.
  renders:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    name: renders (${{ matrix.device }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - name: The command-line tools that know Android 17
        run: |
          tools="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          echo "sdkmanager from $tools"
          if [ "$tools" != "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/preinstalled-backup"
            ln -s "$tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: actions/download-artifact@v8
        with:
          name: sorta-android-apks
          path: android/built-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Choose the device profile
        id: profile
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p android/test-results
          avdmanager list device -c > android/test-results/device-ids.txt
          case "$DEVICE" in
            phone) candidates='pixel_6' ;;
            tablet) candidates='pixel_tablet medium_tablet' ;;
          esac
          profile=''
          for c in $candidates; do
            if grep -qxF "$c" android/test-results/device-ids.txt; then profile=$c; break; fi
          done
          [ -n "$profile" ] || { echo "::error::no profile for $DEVICE among: $candidates"; exit 1; }
          echo "$DEVICE -> $profile" | tee android/test-results/profile.txt
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: The render script
        run: |
          # the emulator runner runs each line of its script on its own, so
          # the steps go in one script
          cat > "$RUNNER_TEMP/renders.sh" <<'SCRIPT'
          set -euo pipefail
          device="$1"
          mkdir -p renders test-results
          trap 'adb logcat -d > test-results/logcat.txt 2>&1 || true' EXIT
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]
          # system crash and not-responding dialogs stay off the screen; the
          # test checks for them too
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put secure anr_show_background 0
          sleep 20
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
          adb shell getprop ro.build.version.sdk | tee test-results/android-sdk.txt
          adb shell settings put system font_scale 1.0
          adb install -r -t built-apks/debug/app-debug.apk
          adb install -r -t built-apks/androidTest/debug/app-debug-androidTest.apk
          # perf, 15 Nov: Sorta's frames timed: the map lively, dragged and flying to a body, the
          # board panned, the deck's card carried and an idea typed in (SortaFrames in the log)
          frames_source=app/src/androidTest/java/com/cramdown/sorta/FramePerfTest.kt
          frames_tests=$(grep -c '@Test' "$frames_source")
          [ "$frames_tests" -eq 4 ]
          echo "expecting OK ($frames_tests tests) and the frames of each phase" | tee -a test-results/expected.txt
          started=$SECONDS
          adb shell am instrument -w -r -e device "$device" -e class com.cramdown.sorta.FramePerfTest \
            com.cramdown.sorta.test/androidx.test.runner.AndroidJUnitRunner | tee test-results/instrumentation-frames.txt
          echo "The frames took $((SECONDS - started)) seconds" | tee -a test-results/time.txt
          adb logcat -d -s SortaFrames:I | tee "test-results/frames-$device.txt" || true
          adb shell settings put global animator_duration_scale 0
          grep -qF "OK ($frames_tests tests)" test-results/instrumentation-frames.txt
          test "$(grep -c 'gl-work' "test-results/frames-$device.txt")" -ge 3
          SCRIPT
      - name: The renders
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.profile }}
          disable-animations: true
          ram-size: 4096M
          disk-size: 8G
          cores: 2
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: android
          script: bash "$RUNNER_TEMP/renders.sh" ${{ matrix.device }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: sorta-android-renders-${{ matrix.device }}
          path: |
            android/renders/
            android/test-results/
          retention-days: 7
