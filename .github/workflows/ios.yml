# Sorta's iOS app, on every copy pushed to Chat-me's sorta branch
# (tools/mirror_chatme.py): the project generated, built for the simulator,
# the app's Info.plist checked, and the launch, gallery and unit tests run on
# an iPhone and an iPad. The look kit's Foundation-only suites run on Linux
# (tools/swift_suites.py). Chat-me is public, so its standard runners cost nothing; no secret is
# used. A second run of the same copy is a re-run of this one.
name: iOS
on:
  push:
    branches: [sorta]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  suites:
    runs-on: ubuntu-latest
    # the swift:6.1 image builds the seven Ward suites in a few minutes
    timeout-minutes: 20
    container: swift:6.1-noble
    # the container's default shell is sh, which has no pipefail
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python
        run: apt-get update -q && apt-get install -yq python3 > /dev/null
      - name: The look kit's suites
        run: |
          set -o pipefail
          python3 tools/swift_suites.py | tee -a "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: macos-latest
    # each simulator now runs five tests, not two; about twice the 16 minutes
    # step 1's runs took, plus the gallery and unit tests
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # What the runner offers for the iPhone Duo, Xcode 27.1 and a foldable
      # simulator: the owner's check of 22 Oct
      - name: What this runner has
        run: |
          {
            echo '### This runner'
            echo '```'
            echo "image $ImageOS $ImageVersion"
            sw_vers
            xcodebuild -version
            ls -d /Applications/Xcode*.app
            xcrun simctl list runtimes | grep -i ios
            xcrun simctl list devicetypes | grep -iE 'duo|fold' || echo "no foldable iPhone among the device types"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tools
        run: brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Pick the simulators
        id: sim
        run: |
          python3 tools/pick_sim.py iphone >> "$GITHUB_OUTPUT"
          python3 tools/pick_sim.py ipad >> "$GITHUB_OUTPUT"
      - name: Build for testing
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Sorta.xcodeproj -scheme Sorta -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee ../build.log | grep -E "error:|warning:|\*\* " || true
          { echo '### Compile errors and warnings'; echo '```'; grep -E "error:|warning:" ../build.log | sed -E 's#^.*/ios/##' | sort -u | head -60 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "TEST BUILD SUCCEEDED" ../build.log
      - name: The app's Info.plist
        run: python3 tools/check_ios_app.py ios/build/Build/Products/Debug-iphonesimulator/Sorta.app
      # each simulator runs once the build has passed, whatever the other did;
      # in run 40718963474 the iPhone's step took 7 to 8 minutes and the iPad's
      # 9, most of it the simulator's first boot, so each may take twice that
      - name: Launch tests on an iPhone
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.iphone_udid }}
        run: bash ../tools/run_ui_tests.sh iphone
      - name: Launch tests on an iPad
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.ipad_udid }}
        run: bash ../tools/run_ui_tests.sh ipad
      # the screenshots the tests kept, where they can be looked at without Xcode
      - name: The screenshots
        if: ${{ always() }}
        run: |
          for bundle in results/*.xcresult; do
            [ -d "$bundle" ] || continue
            name=$(basename "$bundle" .xcresult)
            mkdir -p "shots/$name"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "shots/$name" || true
          done
          ls -R shots 2>/dev/null || echo "no screenshots"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: sorta-ios
          path: |
            build.log
            results/
            shots/
          if-no-files-found: ignore
          retention-days: 7
