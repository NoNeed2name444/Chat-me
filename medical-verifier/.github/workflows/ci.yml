name: Medical Verifier CI

on:
  push:
    paths:
      - "medical-verifier/**"
  pull_request:
    paths:
      - "medical-verifier/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medical-verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: python -m compileall app
      - run: pytest -q
